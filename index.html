<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un Detalle Especial</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Destellos sutiles de fondo -->
  <div class="stars-container" id="stars-bg"></div>

  <!-- Tarjeta Elegante Principal -->
  <main class="romantic-card">
    <div class="card-header">
      <span class="header-tag">Dedicatoria especial</span>
    </div>

    <div class="card-body">
      <!-- Elemento visual central -->
      <div class="vinyl-wrapper">
        <div class="vinyl-disc" id="vinyl">
          <div class="vinyl-center"></div>
        </div>
      </div>

      <div class="message-container">
        <h1 class="card-title">Una nota para ti</h1>
        <p id="typed-text" class="note-text"></p>
      </div>

      <!-- Reproductor para disculpa.ogg -->
      <div class="audio-player">
        <!-- Audio real vinculado a tu archivo local -->
        <audio id="main-audio" src="disculpame.ogg" preload="metadata"></audio>

        <div class="time-info">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>

        <div class="progress-bar-container" id="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="controls">
          <button id="play-btn" class="play-btn" aria-label="Reproducir">
            <svg id="play-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <svg id="pause-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="display: none;">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          </button>
        </div>
      </div>

      <button id="next-note-btn" class="subtle-btn">Ver otro mensaje</button>
    </div>

    <div class="card-footer">
      <span>Con cariño</span>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
