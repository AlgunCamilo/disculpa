<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y2K Romantic Vibes ♡</title>
  <link href="https://fonts.googleapis.com/css2?family=Cherry+Swash:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Animación de fondo de corazones -->
  <div class="hearts-container" id="hearts-bg"></div>

  <!-- Contenedor Principal tipo Ventana Y2K -->
  <main class="y2k-window">
    <div class="window-header">
      <span class="window-title">♡ sweet_memories_v2.0.exe</span>
      <div class="window-controls">
        <button class="win-btn">_</button>
        <button class="win-btn">︎♡</button>
        <button class="win-btn close">X</button>
      </div>
    </div>

    <div class="window-body">
      <!-- Player estilo retro -->
      <section class="player-card">
        <div class="album-cover">
          <div class="vinyl-disc"></div>
          <span class="sparkle">✧</span>
        </div>
        <div class="player-info">
          <h2 class="song-title">Our Favorite Song</h2>
          <p class="artist-name">Años 2000 Mixtape ♡</p>
          <div class="progress-bar">
            <div class="progress-fill"></div>
          </div>
          <div class="player-controls">
            <button id="prev-btn">⏮</button>
            <button id="play-btn" class="main-play">▶</button>
            <button id="next-btn">⏭</button>
          </div>
        </div>
      </section>

      <!-- Carta de amor / Mensaje interactivo -->
      <section class="love-note">
        <h3>✦ Mensaje del Día ✦</h3>
        <p id="typed-text" class="note-text"></p>
        <button id="new-note-btn" class="y2k-button">
          Generar otra nota ✨
        </button>
      </section>
    </div>

    <div class="window-footer">
      <span>Status: Online & In Love ♡</span>
      <span>2000s Aesthetic</span>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
